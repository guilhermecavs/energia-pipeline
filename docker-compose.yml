services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: energia
      POSTGRES_USER: ${ENERGIA_DB_USER}
      POSTGRES_PASSWORD: ${ENERGIA_DB_PASSWORD}
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENERGIA_DB_USER} -d energia"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${ENERGIA_DB_USER}:${ENERGIA_DB_PASSWORD}@postgres:5432/airflow
      PYTHONPATH: /opt/airflow/src
      ENERGIA_DB_HOST: postgres
      ENERGIA_DB_USER: ${ENERGIA_DB_USER}
      ENERGIA_DB_PASSWORD: ${ENERGIA_DB_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    ports:
      - "8080:8080"

volumes:
  pgdata:
